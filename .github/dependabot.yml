version: 2
updates:
  - package-ecosystem: npm
    directory: /chelinstragram-backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Las versiones mayores rompen APIs (Vite, React Router, TypeScript...): se actualizan a mano.
    # Las vulnerabilidades las sigue reportando el job de auditoría del CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /chelinstagram-frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Las versiones mayores rompen APIs (Vite, React Router, TypeScript...): se actualizan a mano.
    # Las vulnerabilidades las sigue reportando el job de auditoría del CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
